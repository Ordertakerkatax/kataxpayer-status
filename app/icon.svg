<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="KaTaxpayer">
  <title>KaTaxpayer</title>
  <!--
    The mark takes its colours from the design tokens. `currentColor` paints the
    circle and the K, so a parent sets it with `color: var(--brand-700)`. The
    bubble and the dot are custom properties with literal fallbacks, for places
    that inherit nothing: a favicon, an e-mail, an open-graph image.

    The K is Plus Jakarta Sans at 800 — the brand's own face — drawn as a path,
    so the mark never waits on a webfont and never shifts if one fails.
  -->
  <circle cx="64" cy="64" r="64" fill="currentColor"/>
  <path d="M44.0 36.0 H86.0 A11.0 11.0 0 0 1 97.0 47.0 V66.0 A11.0 11.0 0 0 1 86.0 77.0 H56.0 L38.0 99.0 L46.0 77.0 H44.0 A11.0 11.0 0 0 1 33.0 66.0 V47.0 A11.0 11.0 0 0 1 44.0 36.0 Z" fill="var(--logo-bubble, #f6f0e6)"/>
  <path d="M66 0V745H221V372L178 387L476 745H670L375 389L384 499L676 0H495L313 315L221 204V0Z" transform="translate(51.55 70.00) scale(0.03624 -0.03624)" fill="currentColor"/>
  <circle cx="99.2" cy="43.4" r="9.3" fill="var(--logo-dot, #ffd60a)"/>
</svg>
